# DuoKart 02-compute — ALB + EC2 Auto Scaling (Day 2, Swapnil's ALB portion)
#
# Purpose: Internet-facing Application Load Balancer that distributes traffic
# across EC2 instances in private subnets. Health checks hit /health on port 5000.
#
# Deploy: CloudFormation -> Create stack -> Upload this file -> stack name
#   `duokart-02-compute` -> region us-east-2. Requires the Day-1 VPC stack
#   (`duokart-01-vpc`) to already be running.
#
# Handoff: Swapnil builds ALB + Listener + Target Group. Prathamesh adds
#   Launch Template + Auto Scaling Group after git pull.
#
# COST NOTE: ALB hours are ~$0.0225/hr (~$0.54/day). Kept up all week like
#   the VPC to avoid daily reprovisioning. Destroy stack nightly only if
#   budget is critical.

AWSTemplateFormatVersion: "2010-09-09"
Description: "DuoKart Day 2: ALB + EC2 Auto Scaling (compute tier)"

Parameters:
  VpcStackName:
    Type: String
    Default: duokart-01-vpc
    Description: "Name of the Day-1 VPC stack to import resources from."
  EnvironmentName:
    Type: String
    Default: dev
    Description: "Tag value for Environment. Matches VPC stack setting."
  DbStackName:
    Type: String
    Default: duokart-03-data
    Description: "Name of Day 3 data stack to fetch DB endpoint from."
  StorageStackName:
    Type: String
    Default: duokart-04-storage
    Description: "Name of Day 4 storage stack to fetch S3 bucket ARNs from."
  BastionKeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: "Console-created key pair for bastion SSH. *.pem never in git."
  QueueStackName:
    Type: String
    Default: duokart-05-queue
    Description: "Name of Day 5 queue stack to fetch SQS/Dynamo ARNs from."

Mappings:
  RegionAmiMap:
    us-east-2:
      UbuntuAmi: ami-0e5497a77ef21b5ac

Resources:
  # ============================================================
  # APPLICATION LOAD BALANCER (internet-facing, public subnets)
  # ============================================================
  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "duokart-${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        - Fn::ImportValue:
            Fn::Sub: "${VpcStackName}-PublicSubnet1Id"
        - Fn::ImportValue:
            Fn::Sub: "${VpcStackName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue:
            Fn::Sub: "${VpcStackName}-AlbSgId"
      Tags:
        - Key: Name
          Value: !Sub "duokart-${EnvironmentName}-alb"
        - Key: Project
          Value: DuoKart
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # TARGET GROUP (points to Flask app on port 5000)
  # ============================================================
  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "duokart-${EnvironmentName}-tg"
      Port: 5000
      Protocol: HTTP
      VpcId:
        Fn::ImportValue:
          Fn::Sub: "${VpcStackName}-VpcId"
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "300"
        - Key: stickiness.enabled
          Value: "false"
      Tags:
        - Key: Name
          Value: !Sub "duokart-${EnvironmentName}-tg"
        - Key: Project
          Value: DuoKart
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

  # ============================================================
  # LISTENER (HTTP 80 -> forward to Target Group)
  # ============================================================
  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ============================================================
  # IAM ROLE — EC2 instance profile (SSM + CloudWatch + S3 read)
  # ============================================================
  Ec2InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "duokart-${EnvironmentName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Policies:
        - PolicyName: FetchDbCreds
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/duokart/dev/*"
        - PolicyName: S3UploadAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: "${StorageStackName}-PhotosBucketArn"
                  - Fn::ImportValue:
                      Fn::Sub: "${StorageStackName}-BillsBucketArn"
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource:
                  - Fn::Join:
                      - ""
                      - - Fn::ImportValue:
                            Fn::Sub: "${StorageStackName}-PhotosBucketArn"
                        - "/*"
                  - Fn::Join:
                      - ""
                      - - Fn::ImportValue:
                            Fn::Sub: "${StorageStackName}-BillsBucketArn"
                        - "/*"
        - PolicyName: OrderApiAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: "${QueueStackName}-OrdersQueueArn"
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Query
                Resource:
                  - Fn::ImportValue:
                      Fn::Sub: "${QueueStackName}-OrdersTableArn"
      Tags:
        - Key: Project
          Value: DuoKart
        - Key: ManagedBy
          Value: CloudFormation

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2InstanceRole

  # ============================================================
  # LAUNCH TEMPLATE — Flask app on port 5000, user-data bootstrap
  # ============================================================
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "duokart-${EnvironmentName}-lt"
      LaunchTemplateData:
        ImageId: !FindInMap [RegionAmiMap, !Ref "AWS::Region", UbuntuAmi]
        InstanceType: t3.micro
        IamInstanceProfile:
          Arn: !GetAtt Ec2InstanceProfile.Arn
        SecurityGroupIds:
          - Fn::ImportValue:
              Fn::Sub: "${VpcStackName}-AppSgId"
        UserData:
          Fn::Base64: |
            #!/bin/bash
            set -euxo pipefail

            apt-get update -y
            apt-get install -y python3 python3-pip python3-venv git awscli

            mkdir -p /opt/duokart
            cd /opt/duokart

            git clone https://github.com/swapnilkumbhare04/duokart.git .

            python3 -m venv venv
            source venv/bin/activate
            pip install --upgrade pip
            pip install flask gunicorn

            if [ -f app/requirements.txt ]; then
              pip install -r app/requirements.txt
            fi

            DB_HOST=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/db-endpoint --query Parameter.Value --output text)
            DB_PASSWORD=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/db-password --with-decryption --query Parameter.Value --output text)
            S3_PHOTOS_BUCKET=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/s3-photos --query Parameter.Value --output text)
            S3_BILLS_BUCKET=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/s3-bills --query Parameter.Value --output text)
            SQS_QUEUE_URL=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/sqs-queue-url --query Parameter.Value --output text)
            DDB_ORDERS_TABLE=$(aws ssm get-parameter --region us-east-2 --name /duokart/dev/ddb-orders-table --query Parameter.Value --output text)

            cat > /etc/systemd/system/duokart.service << EOF
            [Unit]
            Description=DuoKart Flask App
            After=network.target

            [Service]
            User=root
            WorkingDirectory=/opt/duokart/app
            Environment="DB_HOST=$DB_HOST"
            Environment="DB_PORT=3306"
            Environment="DB_USER=admin"
            Environment="DB_PASSWORD=$DB_PASSWORD"
            Environment="DB_NAME=duokart"
            Environment="S3_PHOTOS_BUCKET=$S3_PHOTOS_BUCKET"
            Environment="S3_BILLS_BUCKET=$S3_BILLS_BUCKET"
            Environment="SQS_QUEUE_URL=$SQS_QUEUE_URL"
            Environment="DDB_ORDERS_TABLE=$DDB_ORDERS_TABLE"
            Environment="AWS_REGION=us-east-2"
            ExecStart=/opt/duokart/venv/bin/gunicorn -w 2 -b 0.0.0.0:5000 app:app
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl daemon-reload
            systemctl enable duokart
            systemctl start duokart
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - Key: Name
                Value: !Sub "duokart-${EnvironmentName}-app"
              - Key: Project
                Value: DuoKart
              - Key: Environment
                Value: !Ref EnvironmentName
              - Key: ManagedBy
                Value: CloudFormation
      TagSpecifications:
        - ResourceType: launch-template
          Tags:
            - Key: Project
              Value: DuoKart
            - Key: ManagedBy
              Value: CloudFormation

  # ============================================================
  # AUTO SCALING GROUP — 2 instances across both private subnets
  # ============================================================
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub "duokart-${EnvironmentName}-asg"
      MinSize: "2"
      MaxSize: "4"
      DesiredCapacity: "2"
      VPCZoneIdentifier:
        - Fn::ImportValue:
            Fn::Sub: "${VpcStackName}-PublicSubnet1Id"
        - Fn::ImportValue:
            Fn::Sub: "${VpcStackName}-PublicSubnet2Id"
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      TargetGroupARNs:
        - !Ref AlbTargetGroup
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      MetricsCollection:
        - Granularity: "1Minute"
      Tags:
        - Key: Name
          Value: !Sub "duokart-${EnvironmentName}-app"
          PropagateAtLaunch: true
        - Key: Project
          Value: DuoKart
          PropagateAtLaunch: true
        - Key: Environment
          Value: !Ref EnvironmentName
          PropagateAtLaunch: true
        - Key: ManagedBy
          Value: CloudFormation
          PropagateAtLaunch: true

  # ============================================================
  # BASTION HOST — SSH jump in Public-1 (Swapnil, live-bastion path)
  # ============================================================
  BastionHost:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      KeyName: !Ref BastionKeyName
      ImageId: !FindInMap [RegionAmiMap, !Ref "AWS::Region", UbuntuAmi]
      SubnetId:
        Fn::ImportValue: !Sub "${VpcStackName}-PublicSubnet1Id"
      SecurityGroupIds:
        - Fn::ImportValue: !Sub "${VpcStackName}-BastionSgId"
      Tags:
        - Key: Name
          Value: !Sub "duokart-${EnvironmentName}-bastion"
        - Key: Project
          Value: DuoKart
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  AlbDnsName:
    Description: "ALB DNS — point your browser here to test"
    Value: !GetAtt Alb.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-AlbDnsName"
  AlbArn:
    Description: "Full ALB ARN (for future HTTPS listener)"
    Value: !Ref Alb
    Export:
      Name: !Sub "${AWS::StackName}-AlbArn"
  AlbTargetGroupArn:
    Description: "Target Group ARN — Prathamesh uses this in ASG launch template"
    Value: !Ref AlbTargetGroup
    Export:
      Name: !Sub "${AWS::StackName}-TargetGroupArn"
  AlbListenerArn:
    Description: "Listener ARN (for future rule additions)"
    Value: !Ref AlbListener
    Export:
      Name: !Sub "${AWS::StackName}-ListenerArn"
