name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CloudFormation YAML parses
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml, glob
          class L(yaml.SafeLoader): pass
          L.add_multi_constructor('!', lambda l, s, n: (l.construct_mapping(n) if isinstance(n, yaml.MappingNode) else l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_scalar(n)))
          for f in sorted(glob.glob('infra/*.yaml')):
              yaml.load(open(f), L)
              print('OK', f)
          EOF
      - name: App imports
        run: |
          pip install -r app/requirements.txt
          python -m py_compile app/app.py
      - name: Showcase static guards
        run: |
          test -f docs/index.html
          test -f docs/.nojekyll
          node --check docs/assets/demo.js
          for a in control-room alarms proofs cost playground; do grep -q "id=\"$a\"" docs/index.html || exit 1; done
          python -c "import re,os,sys;refs=set(re.findall(r'src=\"\./([^\"]+)\"',open('docs/index.html').read()));missing=[r for r in refs if not os.path.exists('docs/'+r)];sys.exit(1 if missing else 0)"