name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CloudFormation YAML parses
        run: |
          pip install pyyaml
          python - <<'EOF'
          import yaml, glob
          class L(yaml.SafeLoader): pass
          L.add_multi_constructor('!', lambda l, s, n: (l.construct_mapping(n) if isinstance(n, yaml.MappingNode) else l.construct_sequence(n) if isinstance(n, yaml.SequenceNode) else l.construct_scalar(n)))
          for f in sorted(glob.glob('infra/*.yaml')):
              yaml.load(open(f), L)
              print('OK', f)
          EOF
      - name: App imports
        run: |
          pip install -r app/requirements.txt
          python -m py_compile app/app.py